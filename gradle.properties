org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# org.gradle.java.home dynamically resolved from environment (macOS/Linux/WSL compatible)
android.useAndroidX=true
android.nonTransitiveRClass=true
# Prevent Android Studio from adding -t (testOnly) flag which causes "Test App" warnings during installation
android.injected.testOnly=false

# Optimize D8 dex merging and Gradle worker thread stability
android.enableDexingArtifactTransform=true
org.gradle.caching=true

